<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <select id="skin-select" aria-label="Cambiar skin">
    <option value="retro">Retro</option>
    <option value="neon">Neon</option>
    <option value="pastel">Pastel</option>
    <option value="pixel">Pixel art</option>
  </select>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema"></button>

  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
        <div class="panel-section">
          <span class="label">ENERGY</span>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <span id="ability-status" class="status"></span>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd> hold</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="ability-menu" class="overlay hidden">
        <div class="overlay-box">
          <p id="menu-title">HABILIDAD</p>
          <div id="ability-list" class="menu-list">
            <button class="btn" data-ability="peek"><kbd>1</kbd> Ver siguientes 5 (30s)</button>
            <button class="btn" data-ability="swap"><kbd>2</kbd> Intercambiar pieza</button>
            <button class="btn" data-ability="slow"><kbd>3</kbd> Ralentizar tiempo (10s)</button>
            <button class="btn" data-ability="undo"><kbd>4</kbd> Deshacer última colocación</button>
            <button class="btn" data-ability="hold"><kbd>5</kbd> Reservar pieza (hold)</button>
          </div>
          <div id="swap-list" class="menu-list swap-grid hidden">
            <button class="btn" data-type="1"><kbd>1</kbd> I</button>
            <button class="btn" data-type="2"><kbd>2</kbd> O</button>
            <button class="btn" data-type="3"><kbd>3</kbd> T</button>
            <button class="btn" data-type="4"><kbd>4</kbd> S</button>
            <button class="btn" data-type="5"><kbd>5</kbd> Z</button>
            <button class="btn" data-type="6"><kbd>6</kbd> J</button>
            <button class="btn" data-type="7"><kbd>7</kbd> L</button>
            <button class="btn" data-type="8"><kbd>8</kbd> N</button>
          </div>
          <p id="menu-hint">Esc para cancelar</p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
